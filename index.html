<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diete · Clienti</title>
<style>
  :root {
    --bg: #f5f6f4; --surface: #ffffff; --ink: #1d2a28; --muted: #66736f;
    --line: #dde3df; --accent: #1f6f5c; --accent-ink: #ffffff; --danger: #b3322b;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1, h2 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* Bottoni */
  .btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: var(--radius); cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--danger); }
  .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Campi */
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  textarea { min-height: 76px; resize: vertical; }

  /* Login */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login-box { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
  .login-box h1 { font-size: 24px; margin-bottom: 4px; }
  .login-box p { margin: 0 0 22px; color: var(--muted); }
  .login-box .field { margin-bottom: 14px; }
  .login-box .btn { width: 100%; margin-top: 6px; }

  /* App */
  header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }
  header.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  header.top h1 { font-size: 19px; }
  main.wrap { padding-top: 28px; padding-bottom: 60px; }
  .toolbar { display: flex; gap: 12px; margin-bottom: 18px; }
  .toolbar input { flex: 1; }
  .count { color: var(--muted); font-size: 14px; margin: 0 0 10px; }

  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 1.6fr 1fr 1.4fr auto; gap: 14px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: #f1f5f3; }
  .row .name { font-weight: 600; }
  .row .sub, .row .goal { color: var(--muted); font-size: 14px; }
  .row .goal { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }

  /* Finestra cliente */
  dialog { border: 0; border-radius: 12px; padding: 0; width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 24px); color: var(--ink); background: var(--surface); }
  dialog::backdrop { background: rgba(20, 30, 28, .45); }
  .dlg-head { padding: 20px 24px 8px; }
  .dlg-body { padding: 8px 24px 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; overflow-y: auto; }
  .dlg-body .full { grid-column: 1 / -1; }
  .dlg-foot { display: flex; gap: 10px; padding: 18px 24px 22px; align-items: center; }
  .dlg-foot .spacer { flex: 1; }
  .msg { font-size: 14px; color: var(--danger); min-height: 20px; margin: 4px 24px 0; }
  #loginMsg { margin: 6px 0 0; }

  /* Scheda cliente */
  a.btn { display: inline-block; text-decoration: none; color: inherit; }
  .back { margin-bottom: 16px; }
  .c-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .c-head h2 { font-size: 26px; }
  .c-head p { margin: 2px 0 0; color: var(--muted); }
  .actions { display: flex; gap: 10px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
  .stat small { display: block; color: var(--muted); font-size: 13px; }
  .stat b { font-size: 22px; font-weight: 650; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 26px; }
  .chart-box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 10px; }
  .chart-box h3, h3.sec { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
  .chart-box .cv { position: relative; height: 210px; }
  .row.m { grid-template-columns: 1.2fr repeat(4, 1fr); }
  .row.head { cursor: default; color: var(--muted); font-size: 13px; padding-top: 10px; padding-bottom: 10px; background: #f1f5f3; }
  .row.head:hover { background: #f1f5f3; }
  .dlg-body.three { grid-template-columns: repeat(3, 1fr); }
  .grp { font-weight: 600; margin-top: 6px; }
  .preview { margin: 10px 24px 0; padding: 10px 12px; background: #f1f5f3; border-radius: var(--radius); font-size: 14px; }
  .preview:empty { display: none; }

  /* Calcolatore */
  .calc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 18px 18px; }
  .panel > label { margin-top: 14px; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sl { margin-top: 16px; }
  .sl .top { display: flex; justify-content: space-between; font-size: 14px; }
  .sl label { margin: 0; }
  input[type=range] { padding: 0; border: 0; accent-color: var(--accent); }
  .kv { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .kv span:first-child { color: var(--muted); flex: none; }
  .kv span:last-child { text-align: right; }
  .warn { background: #fff6e5; border: 1px solid #f0d9a8; border-radius: var(--radius); padding: 10px 12px; font-size: 14px; margin-top: 10px; }
  .panel .stats { margin: 16px 0 6px; }
  .row.d { grid-template-columns: 1.4fr 1fr 1fr 1.6fr; cursor: default; }
  .row.d:hover { background: var(--surface); }
  .days { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
  .days label { font-size: 13px; margin: 0 0 2px; }
  .days select { padding: 6px 4px; font-size: 14px; }
  #k_faseBox > label, #k_daysBox > label { margin-top: 14px; }
  table.wk { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px; }
  table.wk th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  table.wk td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .tl-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .tl-opt { width: 280px; max-width: 100%; }
  .tl-row { display: grid; grid-template-columns: 1.3fr 1fr .7fr 1.6fr auto; gap: 10px; align-items: end; margin-top: 12px; }
  .tl-end { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .row.w { grid-template-columns: 1.2fr 1fr 1fr 1fr 1fr 1fr; cursor: default; }
  .row.p { grid-template-columns: 1.2fr 1fr 1.3fr 1.6fr; cursor: default; }
  .row.w:not(.head):hover, .row.p:not(.head):hover { background: var(--surface); }
  @media (max-width: 760px) {
    .row.w { grid-template-columns: 1fr 1fr 1fr; }
    .row.w > :nth-child(n+4) { display: none; }
    .row.p { grid-template-columns: 1fr 1fr 1fr; }
    .row.p > :nth-child(4) { display: none; }
    .tl-row { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 760px) {
    .calc { grid-template-columns: 1fr; }
    .row.d { grid-template-columns: 1.4fr 1fr 1fr; }
    .row.d > :nth-child(4) { display: none; }
  }
  @media (max-width: 640px) {
    .charts { grid-template-columns: 1fr; }
    .row.m { grid-template-columns: 1.2fr 1fr 1fr; }
    .row.m > :nth-child(n+4) { display: none; }
    .dlg-body.three { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr auto; }
    .row .goal { display: none; }
    .dlg-body { grid-template-columns: 1fr; }
    .toolbar { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="hidden">
  <form class="login-box" id="loginForm">
    <h1>Accedi</h1>
    <p>Gestione diete dei clienti</p>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit">Accedi</button>
    <div class="msg" id="loginMsg" role="alert"></div>
  </form>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header class="top"><div class="wrap">
    <h1>Diete</h1>
    <button class="btn" id="logoutBtn" type="button">Esci</button>
  </div></header>

  <main class="wrap">
    <div id="viewList">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Cerca un cliente per nome o cognome" aria-label="Cerca cliente">
      <button class="btn primary" id="newBtn" type="button">Nuovo cliente</button>
    </div>
    <p class="count" id="count"></p>
    <div class="list" id="list"></div>
    </div>

    <div id="viewClient" class="hidden">
      <a class="btn back" href="#">Tutti i clienti</a>
      <div class="c-head">
        <div><h2 id="cName"></h2><p id="cMeta"></p></div>
        <div class="actions">
          <button class="btn" id="editBtn" type="button">Modifica scheda</button>
          <button class="btn" id="newMeasBtn" type="button">Nuova misurazione</button>
          <a class="btn primary" id="newDietBtn" href="#">Nuova dieta</a>
        </div>
      </div>
      <p class="count" id="lastDate"></p>
      <div class="stats" id="stats"></div>
      <div class="charts">
        <div class="chart-box"><h3>Peso (kg)</h3>
          <div class="cv"><canvas id="chW"></canvas></div><div class="empty hidden" id="chW_e">Nessun dato</div></div>
        <div class="chart-box"><h3>Grasso corporeo (%)</h3>
          <div class="cv"><canvas id="chBF"></canvas></div><div class="empty hidden" id="chBF_e">Nessun dato</div></div>
      </div>
      <h3 class="sec">Storico misurazioni</h3>
      <div class="list" id="measList"></div>
      <h3 class="sec" style="margin-top:26px">Diete</h3>
      <div class="list" id="dietList"></div>
      <h3 class="sec" style="margin-top:26px">Ultima dieta: settimana e timeline</h3>
      <div class="list" id="lastDiet"></div>
    </div>

    <div id="viewCalc" class="hidden">
      <a class="btn back" id="calcBack" href="#">Torna al cliente</a>
      <div class="c-head">
        <div><h2 id="calcTitle"></h2><p id="calcMeta"></p></div>
        <div class="actions"><button class="btn primary" id="saveDietBtn" type="button">Salva dieta</button></div>
      </div>
      <div class="empty hidden" id="calcMiss"></div>
      <div class="calc" id="calcBox">
        <form class="panel" id="calcForm" onsubmit="return false">
          <div class="g2">
            <div><label for="k_peso">Peso (kg)</label><input id="k_peso" type="number" step="0.1" min="20" max="300"></div>
            <div><label for="k_bf">Grasso (%)</label><input id="k_bf" type="number" step="0.1" min="2" max="70"></div>
          </div>
          <label for="k_att">Calorie che assume oggi (da anamnesi)</label>
          <input id="k_att" type="number" step="10" min="0" placeholder="Lascia vuoto se non note">
          <label for="k_attiv">Livello di attività</label><select id="k_attiv"></select>
          <label for="k_mb">Formula del metabolismo basale</label><select id="k_mb"></select>
          <label for="k_tdee">Formula del fabbisogno totale</label><select id="k_tdee"></select>
          <label for="k_mode">Struttura della settimana</label>
          <select id="k_mode"><option value="iso">Isocalorica</option><option value="onoff">Cicli ON/OFF (carb cycling)</option><option value="ricomp">Ricomposizione corporea</option></select>
          <div id="k_faseBox"><label for="k_fase">Fase</label><select id="k_fase"></select></div>
          <div id="k_daysBox"><label>Tipo di giorno</label><div class="days" id="k_days"></div></div>
          <div id="k_sliders"></div>
          <label for="k_note">Note sulla dieta</label><textarea id="k_note"></textarea>
        </form>
        <div class="panel" id="calcOut"></div>
      </div>
      <div class="panel" id="tlBox" style="margin-top:18px">
        <div class="tl-head">
          <h3 class="sec" style="margin-top:14px">Timeline delle fasi</h3>
          <div class="tl-opt"><label for="k_dbw">Promemoria diet break dopo (settimane di cut)</label><input id="k_dbw" type="number" min="4" max="8" value="6"></div>
        </div>
        <div id="tlRows"></div>
        <div class="warn hidden" id="tlWarn"></div>
        <button class="btn" id="tlAdd" type="button" style="margin-top:14px">Aggiungi fase</button>
      </div>
    </div>
  </main>
</div>

<!-- FINESTRA CLIENTE -->
<dialog id="dlg">
  <form id="clientForm" method="dialog">
    <div class="dlg-head"><h2 id="dlgTitle">Nuovo cliente</h2></div>
    <div class="dlg-body">
      <div><label for="f_nome">Nome</label><input id="f_nome" required></div>
      <div><label for="f_cognome">Cognome</label><input id="f_cognome" required></div>
      <div><label for="f_sesso">Sesso</label>
        <select id="f_sesso"><option value="">Seleziona</option><option value="M">Uomo</option><option value="F">Donna</option></select></div>
      <div><label for="f_data_nascita">Data di nascita</label><input id="f_data_nascita" type="date"></div>
      <div><label for="f_altezza_cm">Altezza (cm)</label><input id="f_altezza_cm" type="number" step="0.1" min="100" max="250"></div>
      <div><label for="f_telefono">Telefono</label><input id="f_telefono" type="tel"></div>
      <div><label for="f_somatotipo">Somatotipo</label>
        <select id="f_somatotipo"><option value="">Non indicato</option><option value="ecto">Ectomorfo</option><option value="meso">Mesomorfo</option><option value="endo">Endomorfo</option></select></div>
      <div><label for="f_email">Email</label><input id="f_email" type="email"></div>
      <div class="full"><label for="f_obiettivo">Obiettivo</label><input id="f_obiettivo" placeholder="Es. dimagrimento, massa, ricomposizione"></div>
      <div class="full"><label for="f_anamnesi">Anamnesi</label><textarea id="f_anamnesi"></textarea></div>
      <div><label for="f_allergie">Allergie</label><textarea id="f_allergie"></textarea></div>
      <div><label for="f_intolleranze">Intolleranze</label><textarea id="f_intolleranze"></textarea></div>
      <div class="full"><label for="f_note">Note</label><textarea id="f_note"></textarea></div>
    </div>
    <div class="msg" id="formMsg" role="alert"></div>
    <div class="dlg-foot">
      <button class="btn danger hidden" id="delBtn" type="button">Elimina cliente</button>
      <span class="spacer"></span>
      <button class="btn" id="cancelBtn" type="button">Annulla</button>
      <button class="btn primary" type="submit">Salva cliente</button>
    </div>
  </form>
</dialog>

<!-- FINESTRA MISURAZIONE -->
<dialog id="measDlg">
  <form id="measForm" method="dialog">
    <div class="dlg-head"><h2 id="measTitle">Nuova misurazione</h2></div>
    <div class="dlg-body three">
      <div><label for="m_data">Data</label><input id="m_data" type="date" required></div>
      <div><label for="m_peso">Peso (kg)</label><input id="m_peso" type="number" step="0.1" min="20" max="300" required></div>
      <div class="grp full">Pliche</div>
      <div><label id="lp0" for="m_p0"></label><input id="m_p0" type="number" step="0.1" min="0"></div>
      <div><label id="lp1" for="m_p1"></label><input id="m_p1" type="number" step="0.1" min="0"></div>
      <div><label id="lp2" for="m_p2"></label><input id="m_p2" type="number" step="0.1" min="0"></div>
      <div class="full"><label for="m_bf">Oppure % di grasso inserita a mano (es. impedenziometria)</label><input id="m_bf" type="number" step="0.1" min="2" max="70"></div>
      <div class="grp full">Circonferenze (cm)</div>
      <div><label for="m_vita">Vita</label><input id="m_vita" type="number" step="0.1" min="0"></div>
      <div><label for="m_fianchi">Fianchi</label><input id="m_fianchi" type="number" step="0.1" min="0"></div>
      <div><label for="m_petto">Petto</label><input id="m_petto" type="number" step="0.1" min="0"></div>
      <div><label for="m_braccio">Braccio</label><input id="m_braccio" type="number" step="0.1" min="0"></div>
      <div><label for="m_coscia">Coscia</label><input id="m_coscia" type="number" step="0.1" min="0"></div>
      <div class="full"><label for="m_note">Note</label><textarea id="m_note"></textarea></div>
    </div>
    <div class="preview" id="mPreview"></div>
    <div class="msg" id="measMsg" role="alert"></div>
    <div class="dlg-foot">
      <button class="btn danger hidden" id="measDelBtn" type="button">Elimina</button>
      <span class="spacer"></span>
      <button class="btn" id="measCancelBtn" type="button">Annulla</button>
      <button class="btn primary" type="submit">Salva misurazione</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="calc.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://gwjipgrobvbowyeenncc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3amlwZ3JvYnZib3d5ZWVubmNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MzU0MDUsImV4cCI6MjEwOTAxMTQwNX0.tjsSholCb23T6guxEIJ4b7u37rKseBqI4AIPFJBbgBM';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const FIELDS = ['nome','cognome','sesso','data_nascita','altezza_cm','telefono','somatotipo','email','obiettivo','anamnesi','allergie','intolleranze','note'];
let clients = [];
let editingId = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function age(iso) {
  if (!iso) return null;
  const b = new Date(iso), n = new Date();
  let a = n.getFullYear() - b.getFullYear();
  if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--;
  return a;
}

/* ---------- Accesso ---------- */
function show(loggedIn) {
  $('login').classList.toggle('hidden', loggedIn);
  $('app').classList.toggle('hidden', !loggedIn);
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginMsg').textContent = '';
  const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) { $('loginMsg').textContent = 'Email o password non corrette.'; return; }
  await start();
});

$('logoutBtn').addEventListener('click', async () => {
  await db.auth.signOut();
  clients = [];
  location.hash = '';
  show(false);
});

/* ---------- Elenco clienti ---------- */
async function loadClients() {
  const { data, error } = await db.from('clients').select('*').order('cognome').order('nome');
  if (error) { $('list').innerHTML = '<div class="empty">Non riesco a caricare i clienti. Hai eseguito lo script schema.sql su Supabase?</div>'; return; }
  clients = data;
  render();
  route();
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const rows = clients.filter(c => (c.cognome + ' ' + c.nome).toLowerCase().includes(q));
  $('count').textContent = clients.length ? `${rows.length} di ${clients.length} clienti` : '';
  if (!rows.length) {
    $('list').innerHTML = `<div class="empty">${clients.length ? 'Nessun cliente corrisponde alla ricerca.' : 'Non ci sono ancora clienti. Aggiungi il primo con “Nuovo cliente”.'}</div>`;
    return;
  }
  $('list').innerHTML = rows.map(c => {
    const a = age(c.data_nascita);
    const sub = [c.sesso === 'M' ? 'Uomo' : c.sesso === 'F' ? 'Donna' : '', a != null ? a + ' anni' : ''].filter(Boolean).join(', ');
    return `<div class="row" tabindex="0" role="button" data-id="${esc(c.id)}">
      <div class="name">${esc(c.cognome)} ${esc(c.nome)}</div>
      <div class="sub">${esc(sub)}</div>
      <div class="goal">${esc(c.obiettivo)}</div>
      <div class="sub">${c.altezza_cm ? esc(c.altezza_cm) + ' cm' : ''}</div>
    </div>`;
  }).join('');
}

$('search').addEventListener('input', render);

/* ---------- Scheda cliente e misurazioni ---------- */
const PLICHE = {
  M: [['petto', 'Petto'], ['addome', 'Addome'], ['coscia', 'Coscia']],
  F: [['tricipite', 'Tricipite'], ['soprailiaca', 'Soprailiaca'], ['coscia', 'Coscia']]
};
const MISURE = ['vita', 'fianchi', 'petto', 'braccio', 'coscia'];
let current = null, measurements = [], diets = [], lastDays = [], lastPhases = [], editingMeas = null, charts = [];

const num = v => (v === '' || v == null || isNaN(Number(v))) ? null : Number(v);
const fmt = (v, d = 1) => v == null ? '-' : Number(v).toLocaleString('it-IT', { maximumFractionDigits: d });
const fmtDate = iso => new Date(iso + 'T00:00:00').toLocaleDateString('it-IT');

function ageAt(birth, on) {
  if (!birth) return null;
  const b = new Date(birth), n = new Date(on || new Date().toISOString().slice(0, 10));
  let a = n.getUTCFullYear() - b.getUTCFullYear();
  if (n.getUTCMonth() < b.getUTCMonth() || (n.getUTCMonth() === b.getUTCMonth() && n.getUTCDate() < b.getUTCDate())) a--;
  return a;
}

// Jackson & Pollock a 3 pliche (S = somma in mm) + formula di Siri
function bfFromSkinfolds(sesso, eta, S) {
  const d = sesso === 'M'
    ? 1.10938 - (8.267 * S) / 10000 + (1.6 * S * S) / 1000000 - (2.574 * eta) / 10000
    : 1.0994921 - (9.929 * S) / 10000 + (2.3 * S * S) / 1000000 - (1.392 * eta) / 10000;
  return 495 / d - 450;
}

function compute(m) {
  const fm = m.peso_kg != null && m.bf_percent != null ? m.peso_kg * m.bf_percent / 100 : null;
  return { fm, lbm: fm != null ? m.peso_kg - fm : null };
}

async function route() {
  const m = location.hash.match(/^#c=([^/]+)(\/calc)?$/);
  const c = m && clients.find(x => x.id === m[1]);
  const calc = !!(c && m[2]);
  $('viewList').classList.toggle('hidden', !!c);
  $('viewClient').classList.toggle('hidden', !c || calc);
  $('viewCalc').classList.toggle('hidden', !calc);
  if (!c) { current = null; return; }
  await showClient(c);
  if (calc && current === c) initCalc();
}
window.addEventListener('hashchange', route);

async function showClient(c) {
  current = c;
  $('cName').textContent = `${c.nome} ${c.cognome}`;
  const a = ageAt(c.data_nascita);
  $('cMeta').textContent = [c.sesso === 'M' ? 'Uomo' : c.sesso === 'F' ? 'Donna' : '', a != null ? a + ' anni' : '', c.altezza_cm ? c.altezza_cm + ' cm' : '', c.obiettivo].filter(Boolean).join(', ');
  $('newDietBtn').href = '#c=' + c.id + '/calc';
  const [ms, ds] = await Promise.all([
    db.from('measurements').select('*').eq('client_id', c.id).order('data'),
    db.from('diets').select('*').eq('client_id', c.id).order('versione', { ascending: false })
  ]);
  if (current !== c) return;
  measurements = ms.error ? [] : ms.data;
  diets = ds.error ? [] : ds.data;
  lastDays = []; lastPhases = [];
  if (diets[0]) {
    const [a, b] = await Promise.all([
      db.from('diet_days').select('*').eq('diet_id', diets[0].id).order('giorno'),
      db.from('diet_phases').select('*').eq('diet_id', diets[0].id).order('inizio')
    ]);
    if (current !== c) return;
    lastDays = a.data || []; lastPhases = b.data || [];
  }
  renderMeasurements();
  renderDiets();
}

function renderDiets() {
  $('dietList').innerHTML = diets.length
    ? '<div class="row d head"><div>Dieta</div><div>Data</div><div>Kcal</div><div>Proteine, carboidrati, grassi</div></div>'
      + diets.map(d => { const r = d.risultati || {}; return `<div class="row d">
          <div>${esc(d.titolo)}</div><div>${fmtDate(d.data)}</div><div>${fmt(r.kcal, 0)}</div>
          <div>${fmt(r.pro, 0)} g, ${fmt(r.carb, 0)} g, ${fmt(r.fat, 0)} g</div></div>`; }).join('')
    : '<div class="empty">Non ci sono diete. Crea la prima con “Nuova dieta”.</div>';

  if (!diets.length) { $('lastDiet').innerHTML = '<div class="empty">Comparirà dopo aver salvato la prima dieta.</div>'; return; }
  const week = lastDays.length
    ? '<div class="row w head"><div>Giorno</div><div>Tipo</div><div>Kcal</div><div>Proteine</div><div>Carboidrati</div><div>Grassi</div></div>'
      + lastDays.map(d => `<div class="row w"><div>${GG[d.giorno - 1]}</div><div>${TIPI[d.tipo] || ''}</div><div>${fmt(d.kcal, 0)}</div><div>${fmt(d.pro, 0)} g</div><div>${fmt(d.carb, 0)} g</div><div>${fmt(d.fat, 0)} g</div></div>`).join('')
    : '';
  const tl = lastPhases.length
    ? '<div class="row p head"><div>Fase</div><div>Dal</div><div>Al</div><div>Note</div></div>'
      + lastPhases.map(f => `<div class="row p"><div>${esc(FASI_TL[f.tipo] || f.tipo)}</div><div>${fmtDate(f.inizio)}</div>
          <div>${fmtDate(addDays(f.inizio, f.settimane * 7 - 1))} (${f.settimane} sett.)</div><div>${esc(f.note)}</div></div>`).join('')
    : '<div class="empty">Questa dieta non ha una timeline.</div>';
  $('lastDiet').innerHTML = week + tl;
}

function makeChart(id, pts, get, unit) {
  $(id).parentElement.classList.toggle('hidden', !pts.length);
  $(id + '_e').classList.toggle('hidden', !!pts.length);
  if (!pts.length || typeof Chart === 'undefined') return;
  charts.push(new Chart($(id), {
    type: 'line',
    data: { labels: pts.map(p => fmtDate(p.data)), datasets: [{ data: pts.map(get), borderColor: '#1f6f5c', backgroundColor: '#1f6f5c', tension: .25, pointRadius: 4 }] },
    options: {
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => fmt(c.parsed.y) + ' ' + unit } } },
      scales: { y: { ticks: { callback: v => fmt(v) } } }
    }
  }));
}

function renderMeasurements() {
  const rows = measurements.map(m => ({ ...m, ...compute(m) }));
  const last = rows[rows.length - 1];
  const h = current.altezza_cm ? current.altezza_cm / 100 : null;
  const bmi = last && last.peso_kg && h ? last.peso_kg / (h * h) : null;

  $('lastDate').textContent = last ? 'Ultima misurazione: ' + fmtDate(last.data) : '';
  $('stats').innerHTML = last ? [
    ['Peso (kg)', last.peso_kg], ['Grasso (%)', last.bf_percent],
    ['Massa magra (kg)', last.lbm], ['Massa grassa (kg)', last.fm], ['BMI', bmi]
  ].map(([l, v]) => `<div class="stat"><small>${l}</small><b>${fmt(v)}</b></div>`).join('') : '';

  charts.forEach(ch => ch.destroy());
  charts = [];
  makeChart('chW', rows.filter(r => r.peso_kg != null), r => r.peso_kg, 'kg');
  makeChart('chBF', rows.filter(r => r.bf_percent != null), r => r.bf_percent, '%');

  $('measList').innerHTML = rows.length
    ? '<div class="row m head"><div>Data</div><div>Peso</div><div>Grasso</div><div>Massa magra</div><div>Massa grassa</div></div>'
      + rows.slice().reverse().map(r => `<div class="row m" tabindex="0" role="button" data-id="${esc(r.id)}">
          <div>${fmtDate(r.data)}</div><div>${fmt(r.peso_kg)} kg</div>
          <div>${r.bf_percent != null ? fmt(r.bf_percent) + ' %' : '-'}</div>
          <div>${r.lbm != null ? fmt(r.lbm) + ' kg' : '-'}</div>
          <div>${r.fm != null ? fmt(r.fm) + ' kg' : '-'}</div></div>`).join('')
    : '<div class="empty">Non ci sono misurazioni. Aggiungi la prima con “Nuova misurazione”.</div>';
}

// Legge il modulo e calcola il % di grasso (dalle pliche se sono tutte e tre, altrimenti il valore a mano)
function readMeas() {
  const names = PLICHE[current.sesso];
  const peso = num($('m_peso').value);
  const vals = [0, 1, 2].map(i => num($('m_p' + i).value));
  const full = vals.every(v => v != null);
  const eta = ageAt(current.data_nascita, $('m_data').value);
  let bf = null, pliche = null, note = '';
  if (full && names && eta != null) {
    bf = Math.round(bfFromSkinfolds(current.sesso, eta, vals[0] + vals[1] + vals[2]) * 10) / 10;
    pliche = Object.fromEntries(names.map(([k], i) => [k, vals[i]]));
  } else {
    bf = num($('m_bf').value);
    if (full) note = 'Per calcolare il % di grasso dalle pliche servono sesso e data di nascita nella scheda del cliente.';
    else if (vals.some(v => v != null)) note = 'Inserisci tutte e tre le pliche per calcolare il % di grasso.';
  }
  return { peso, bf, pliche, note };
}

function updatePreview() {
  const r = readMeas();
  const c = compute({ peso_kg: r.peso, bf_percent: r.bf });
  const parts = [];
  if (r.bf != null) {
    parts.push('Grasso ' + fmt(r.bf) + ' %');
    if (c.fm != null) parts.push('massa grassa ' + fmt(c.fm) + ' kg', 'massa magra ' + fmt(c.lbm) + ' kg');
  }
  $('mPreview').textContent = [parts.join(', '), r.note].filter(Boolean).join('. ');
}

  };

});

/* ---------- Calcolatore ---------- */
const GG = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
const TIPI = { on: 'ON', off: 'OFF', refeed: 'Refeed', normo: 'Normale', iper: 'Iper', ipo: 'Ipo' };
const FASI_TL = { reset: 'Reset metabolico', cut: 'Cut', bulk: 'Bulk', mantenimento: 'Mantenimento', diet_break: 'Diet break', ricomposizione: 'Ricomposizione' };
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (iso, n) => new Date(Date.parse(iso) + n * 864e5).toISOString().slice(0, 10);
const row = (a, b) => `<div class="kv"><span>${a}</span><span>${b}</span></div>`;
let K = { mode: 'iso', fase: 'cut', v: {}, days: [], phases: [] }, OUT = null, WEEK = null;

(function fillSelects() {
  const opt = o => Object.entries(o).map(([k, x]) => `<option value="${k}">${esc(x.nome)}</option>`).join('');
  $('k_attiv').innerHTML = opt(Calc.ATT);
  $('k_mb').innerHTML = opt(Calc.BMR);
  $('k_tdee').innerHTML = opt(Calc.TDEE);
  $('k_fase').innerHTML = opt(Calc.FASI);
})();

const phaseOf = () => K.mode === 'ricomp' ? 'ricomposizione' : ({ reset: 'reset', cut: 'cut', bulk: 'bulk', mant: 'mantenimento' })[K.fase];

function initCalc() {
  const c = current, eta = ageAt(c.data_nascita);
  const miss = [!c.sesso && 'sesso', eta == null && 'data di nascita', !c.altezza_cm && 'altezza'].filter(Boolean);
  $('calcBack').href = '#c=' + c.id;
  $('calcTitle').textContent = `Nuova dieta: ${c.nome} ${c.cognome}`;
  $('calcMeta').textContent = $('cMeta').textContent;
  $('calcMiss').textContent = `Per calcolare servono ${miss.join(', ')} nella scheda del cliente.`;
  $('calcMiss').classList.toggle('hidden', !miss.length);
  $('calcBox').classList.toggle('hidden', !!miss.length);
  $('tlBox').classList.toggle('hidden', !!miss.length);
  $('saveDietBtn').classList.toggle('hidden', !!miss.length);
  if (miss.length) return;

  const last = measurements[measurements.length - 1], prev = diets[0]?.parametri || {};
  $('k_peso').value = last?.peso_kg ?? '';
  $('k_bf').value = last?.bf_percent ?? '';
  $('k_att').value = prev.kcalAtt ?? '';
  $('k_attiv').value = prev.att || 'mod';
  $('k_mb').value = prev.mb || 'mifflin';
  $('k_tdee').value = prev.tdee || 'mcdonald';
  $('k_note').value = '';
  const soglia = c.sesso === 'M' ? 31 : 28;
  K.fase = (prev.kcalAtt && last?.peso_kg && prev.kcalAtt / last.peso_kg < soglia) ? 'reset' : 'cut';
  K.mode = prev.mode || 'iso';
  K.days = [...Calc.GIORNI_DEF[K.mode]];
  $('k_fase').value = K.fase;
  $('k_mode').value = K.mode;
  $('k_faseBox').classList.toggle('hidden', K.mode === 'ricomp');
  K.phases = [{ tipo: phaseOf(), inizio: today(), settimane: 8, note: '', auto: true }];
  $('k_dbw').value = prev.dietBreak || 6;
  renderDays();
  renderTl();
  checkBreak();
  setSliders(false);
}

function renderDays() {
  const t = Calc.GIORNI_TIPI[K.mode];
  $('k_days').innerHTML = GG.map((g, i) => `<div><label for="d_${i}">${g.slice(0, 3)}</label>
    <select id="d_${i}" data-i="${i}">${Object.entries(t).map(([k, n]) => `<option value="${k}"${K.days[i] === k ? ' selected' : ''}>${n}</option>`).join('')}</select></div>`).join('');
}

function setSliders(keep) {
  const spec = K.mode === 'ricomp' ? Calc.SLIDERS_RICOMP
    : [...Calc.sliders(K.fase, current.sesso), ...Calc.slidersExtra(K.mode, K.days, current.somatotipo)];
  K.v = Object.fromEntries(spec.map(s => [s[0], keep && K.v[s[0]] != null ? K.v[s[0]] : s[5]]));
  $('k_sliders').innerHTML = spec.map(([k, l, u, mn, mx, , st]) =>
    `<div class="sl"><div class="top"><label for="s_${k}">${l}</label><b id="sv_${k}">${fmt(K.v[k], 2)} ${u}</b></div>
     <input type="range" id="s_${k}" data-k="${k}" data-u="${u}" min="${mn}" max="${mx}" step="${st}" value="${K.v[k]}"></div>`).join('');
  recalc();
}

function syncAutoPhase() {
  if (K.phases.length === 1 && K.phases[0].auto) { K.phases[0].tipo = phaseOf(); renderTl(); }
}

$('calcForm').addEventListener('input', e => {
  const t = e.target;
  if (t.type === 'range') {
    K.v[t.dataset.k] = Number(t.value);
    $('sv_' + t.dataset.k).textContent = fmt(K.v[t.dataset.k], 2) + ' ' + t.dataset.u;
    recalc();
  } else if (t.id === 'k_mode') {
    K.mode = t.value;
    K.days = [...Calc.GIORNI_DEF[K.mode]];
    $('k_faseBox').classList.toggle('hidden', K.mode === 'ricomp');
    renderDays(); syncAutoPhase(); setSliders(false);
  } else if (t.id === 'k_fase') {
    K.fase = t.value; syncAutoPhase(); setSliders(false);
  } else if (t.closest('#k_days')) {
    K.days[Number(t.dataset.i)] = t.value; setSliders(true);
  } else recalc();
});

function readCalc() {
  const c = current;
  return { sesso: c.sesso, eta: ageAt(c.data_nascita), altezza: c.altezza_cm, peso: num($('k_peso').value), bf: num($('k_bf').value),
    kcalAtt: num($('k_att').value), att: $('k_attiv').value, mb: $('k_mb').value, tdee: $('k_tdee').value };
}

function weekTable(giorni) {
  return `<table class="wk"><thead><tr><th>Giorno</th><th>Tipo</th><th>Kcal</th><th>Prot. (g)</th><th>Carb. (g)</th><th>Grassi (g)</th></tr></thead><tbody>`
    + giorni.map((d, i) => `<tr><td>${GG[i].slice(0, 3)}</td><td>${TIPI[d.tipo]}</td><td>${fmt(d.kcal, 0)}</td><td>${fmt(d.pro, 0)}</td><td>${fmt(d.carb, 0)}</td><td>${fmt(d.fat, 0)}</td></tr>`).join('')
    + '</tbody></table>';
}

function recalc() {
  const p = readCalc();
  OUT = WEEK = null;
  if (!p.peso) { $('calcOut').innerHTML = '<div class="empty">Inserisci il peso del cliente per vedere il calcolo.</div>'; return; }
  const ricomp = K.mode === 'ricomp';
  let o, w, avvisi, labels, extra = '';

  if (ricomp) {
    const b = Calc.calcola(p, 'mant', { pro: 1.7, fat: 0.8 });   // serve solo per basale, fabbisogno e check
    const r = Calc.ricomp(p, b, K.v, K.days);
    if (r.errore) { $('calcOut').innerHTML = `<div class="warn">${esc(r.errore)}</div>`; return; }
    const af = Calc.acquaFibre(p.peso, r.medie.kcal, false);
    o = { ...b, kcal: Math.round(r.medie.kcal), pro: Math.round(r.medie.pro), carb: Math.round(r.medie.carb), fat: Math.round(r.medie.fat), acqua: af.acqua, fibre: af.fibre, quota: null };
    w = r; avvisi = r.avvisi;
    labels = ['Kcal medie al giorno', 'Proteine al giorno', 'Carboidrati medi', 'Grassi al giorno'];
    extra = row('Massa magra', fmt(r.lbm, 1) + ' kg') + row('Carboidrati attorno all\'allenamento', `${r.periwo[0]}-${r.periwo[1]} g`);
  } else {
    o = Calc.calcola(p, K.fase, K.v);
    w = Calc.settimana(p, o, K.mode, K.days, K.v);
    avvisi = [...o.avvisi, ...w.avvisi];
    labels = ['Kcal al giorno', 'Proteine', 'Carboidrati', 'Grassi'];
  }
  OUT = o; WEEK = w;
  const varied = new Set(w.giorni.map(d => d.kcal + '/' + d.carb)).size > 1;
  if (varied && !ricomp) labels = ['Kcal base al giorno', 'Proteine', 'Carboidrati base', 'Grassi'];
  const q = o.quota;
  const confronto = Object.entries(o.mbAll).map(([k, v]) => `${Calc.BMR[k].corto} ${fmt(v, 0)}`).join(', ');
  const af = o.acqua;

  $('calcOut').innerHTML = `
    <div class="stats">
      <div class="stat"><small>${labels[0]}</small><b>${fmt(o.kcal, 0)}</b></div>
      <div class="stat"><small>${labels[1]}</small><b>${fmt(o.pro, 0)} g</b></div>
      <div class="stat"><small>${labels[2]}</small><b>${fmt(o.carb, 0)} g</b></div>
      <div class="stat"><small>${labels[3]}</small><b>${fmt(o.fat, 0)} g</b></div>
    </div>
    ${varied ? weekTable(w.giorni) + row('Media settimanale', fmt(w.media, 0) + ' kcal al giorno') : ''}
    ${q ? row('Quota delle calorie', `proteine ${q.pro}%, carboidrati ${q.carb}%, grassi ${q.fat}%`) : ''}
    ${extra}
    ${row('Metabolismo basale', fmt(o.mb, 0) + ' kcal')}
    ${row('Confronto formule', confronto)}
    ${row('Fabbisogno totale', fmt(o.tdee, 0) + ' kcal')}
    ${row('Check metabolico', o.check)}
    ${o.reset ? row('Piano del reset', `+${fmt(o.reset.diff, 0)} kcal in circa ${o.reset.settimane[0]}-${o.reset.settimane[1]} settimane (+40-60 kcal ogni 7-14 giorni)`) : ''}
    ${o.ritmo ? row('Ritmo stimato', `${fmt(o.ritmo.kg, 2)} kg a settimana (${fmt(o.ritmo.pct, 2)}% del peso)`) : ''}
    ${row('Acqua', (af.min === af.max ? `${fmt(af.min, 1)} L` : `${fmt(af.min, 1)}-${fmt(af.max, 1)} L`) + `, oppure ${fmt(af.f2, 1)} L con la seconda formula`)}
    ${row('Fibre', `${o.fibre.min}-${o.fibre.max} g (suggerite ${o.fibre.sug} g)`)}
    ${avvisi.map(a => `<div class="warn">${esc(a)}</div>`).join('')}`;
}

/* ---------- Timeline delle fasi ---------- */
const tlEnd = f => f.inizio && Number(f.settimane) > 0 ? 'Fino al ' + fmtDate(addDays(f.inizio, Number(f.settimane) * 7 - 1)) : '';
const tlOpts = sel => Object.entries(FASI_TL).map(([k, n]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${n}</option>`).join('');

function renderTl() {
  $('tlRows').innerHTML = K.phases.map((f, i) => `<div class="tl-row">
      <div><label for="tp_${i}">Fase</label><select id="tp_${i}" data-i="${i}" data-f="tipo">${tlOpts(f.tipo)}</select></div>
      <div><label for="ti_${i}">Inizio</label><input id="ti_${i}" type="date" data-i="${i}" data-f="inizio" value="${esc(f.inizio)}"></div>
      <div><label for="ts_${i}">Settimane</label><input id="ts_${i}" type="number" min="1" max="52" data-i="${i}" data-f="settimane" value="${esc(f.settimane)}"></div>
      <div><label for="tn_${i}">Note</label><input id="tn_${i}" data-i="${i}" data-f="note" value="${esc(f.note)}"></div>
      <button class="btn danger" type="button" data-del="${i}">Togli</button>
    </div><div class="tl-end" id="tle_${i}">${tlEnd(f)}</div>`).join('');
}

function checkBreak() {
  const lim = Number($('k_dbw').value) || 6;
  let run = 0, msg = '';
  for (const f of K.phases) {
    if (f.tipo === 'cut') {
      run += Number(f.settimane) || 0;
      if (run > lim) { msg = `Il cut continuo arriva a ${run} settimane: il documento consiglia 1-2 settimane in mantenimento (diet break) ogni 4-8 settimane di restrizione.`; break; }
    } else if (f.tipo === 'diet_break' || f.tipo === 'mantenimento') run = 0;
  }
  $('tlWarn').textContent = msg;
  $('tlWarn').classList.toggle('hidden', !msg);
}

$('tlRows').addEventListener('input', e => {
  const t = e.target, i = t.dataset.i;
  if (i == null) return;
  const f = K.phases[i];
  f[t.dataset.f] = t.value; f.auto = false;
  $('tle_' + i).textContent = tlEnd(f);
  checkBreak();
});
$('tlRows').addEventListener('click', e => {
  const d = e.target.dataset.del;
  if (d == null) return;
  K.phases.splice(Number(d), 1); renderTl(); checkBreak();
});
$('tlAdd').addEventListener('click', () => {
  const l = K.phases[K.phases.length - 1];
  K.phases.push({
    tipo: l ? (l.tipo === 'cut' ? 'diet_break' : 'mantenimento') : phaseOf(),
    inizio: l && l.inizio && Number(l.settimane) > 0 ? addDays(l.inizio, Number(l.settimane) * 7) : today(),
    settimane: 2, note: ''
  });
  renderTl(); checkBreak();
});
$('k_dbw').addEventListener('input', checkBreak);

/* ---------- Salvataggio ---------- */
$('saveDietBtn').addEventListener('click', async () => {
  if (!OUT || !WEEK) { alert('Inserisci il peso del cliente.'); return; }
  const btn = $('saveDietBtn');
  btn.disabled = true;
  const { data: prev } = await db.from('diets').select('versione').eq('client_id', current.id).order('versione', { ascending: false }).limit(1);
  const versione = (prev?.[0]?.versione || 0) + 1;
  const nome = K.mode === 'ricomp' ? 'Ricomposizione corporea' : Calc.FASI[K.fase].nome + (K.mode === 'onoff' ? ', cicli ON/OFF' : '');
  const ins = await db.from('diets').insert({
    client_id: current.id, versione, titolo: `Dieta ${versione}: ${nome}`, data: today(),
    parametri: { ...readCalc(), fase: K.fase, mode: K.mode, slider: K.v, giorni: K.days, dietBreak: Number($('k_dbw').value) || 6 },
    risultati: { ...OUT, media: Math.round(WEEK.media) }, note: $('k_note').value.trim() || null
  }).select('id').single();
  if (ins.error) { btn.disabled = false; alert('Salvataggio non riuscito: ' + ins.error.message); return; }

  const id = ins.data.id;
  const giorni = WEEK.giorni.map((d, i) => ({ diet_id: id, giorno: i + 1, tipo: d.tipo, kcal: d.kcal, pro: d.pro, carb: d.carb, fat: d.fat }));
  const fasi = K.phases.filter(f => f.inizio && Number(f.settimane) > 0)
    .map(f => ({ diet_id: id, tipo: f.tipo, inizio: f.inizio, settimane: Number(f.settimane), note: f.note || null }));
  const r1 = await db.from('diet_days').insert(giorni);
  const r2 = fasi.length ? await db.from('diet_phases').insert(fasi) : {};
  btn.disabled = false;
  if (r1.error || r2.error) {
    await db.from('diets').delete().eq('id', id);
    alert('Salvataggio non riuscito: ' + (r1.error || r2.error).message);
    return;
  }
  location.hash = '#c=' + current.id;
});

/* ---------- Avvio ---------- */
async function start() {
  show(true);
  await loadClients();
}

(async () => {
  const { data } = await db.auth.getSession();
  if (data.session) await start(); else show(false);
})();
</script>
</body>
